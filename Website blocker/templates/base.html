<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OrgShield AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">


<style>

:root {
  --primary-blue: #1d4ed8;
  --soft-blue: #3b82f6;
  --navy-dark: #0b1e33;
  --navy-mid: #122b47;
  --glass-bg: rgba(255,255,255,0.06);
  --text-light: #e6edf5;
}

/* ===== BODY ===== */

body {
  font-family: 'Inter', sans-serif;
  background: #0b1e33;
  color: var(--text-light);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* Background image layer */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background: url("{{ url_for('static', filename='images/cyber_bg.jpg') }}") no-repeat center center;
  background-size: cover;

  filter: brightness(0.5) contrast(1.1);
  z-index: -2;
}

/* Dark overlay for executive feel */
body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background: linear-gradient(
    to bottom,
    rgba(10,20,35,0.8),
    rgba(10,20,35,0.9)
  );

  z-index: -1;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== NAVBAR ===== */

.navbar {
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.navbar-brand {
  font-weight: 700;
  font-size: 1.4rem;
  letter-spacing: 0.5px;
  color: #60a5fa !important;
}

/* ===== HERO ===== */

.hero-section {
  padding: 140px 0;
}

.hero-title {
  font-size: 3.8rem;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -1px;
  color: #ffffff;
}

.hero-subtitle {
  font-size: 1.2rem;
  opacity: 0.85;
  margin-top: 25px;
}

/* ===== BUTTONS ===== */

.btn-primary-exec {
  background: linear-gradient(90deg, #2563eb, #1d4ed8);
  border: none;
  padding: 14px 32px;
  font-weight: 600;
  border-radius: 8px;
  transition: 0.3s ease;
}

.btn-primary-exec:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(37,99,235,0.4);
}

.btn-outline-exec {
  border: 1px solid rgba(255,255,255,0.4);
  padding: 14px 32px;
  border-radius: 8px;
  transition: 0.3s ease;
  color: #fff;
}

.btn-outline-exec:hover {
  background: rgba(255,255,255,0.1);
}

/* ===== GLASS CARD ===== */

.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(25px);
  border-radius: 20px;
  padding: 45px;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  transition: 0.4s ease;
}

.glass-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 25px 60px rgba(0,0,0,0.55);
}

/* ===== LIST ===== */

.feature-list li {
  margin-bottom: 15px;
  font-size: 1.05rem;
  opacity: 0.9;
}

/* ===== FOOTER ===== */

footer {
  margin-top: 100px;
  padding: 30px;
  opacity: 0.6;
  font-size: 0.9rem;
}

/* ===== IMAGE CARD ===== */

.image-card {
  border-radius: 25px;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.27);
  transition: 0.4s ease;
}

.image-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 35px 80px rgba(0, 0, 0, 0.34);
}

.hero-image {
  width: 50%;
  height: 50%;
  object-fit: cover;
  filter: brightness(0.92);
}

.dashboard-title {
    font-weight: 500;
    font-size: 32px;
    color: #e6edf3;
}

.glass-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: 0.3s ease;
}

.glass-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 25px rgba(0, 153, 255, 0.25);
}

.stat-card h6 {
    color: #9ca3af;
    margin-bottom: 10px;
}

.stat-number {
    font-size: 36px;
    font-weight: 500;
}

.text-cyan {
    color: #00eaff;
}


/* ===== BLENDED AI IMAGE ===== */

.ai-image-blend {
  position: relative;
  display: inline-block;
  padding: 20px;
}

/* Make image smaller */
.hero-image-blend {
  width: 85%;
  border-radius: 20px;
  opacity: 0.92;

  /* Blend with background */
  mix-blend-mode: screen;
  filter: brightness(1.05) contrast(1.05);

  transition: 0.4s ease;
}

/* Soft executive glow */
.ai-image-blend::before {
  content: "";
  position: absolute;
  top: 20%;
  left: 20%;
  width: 60%;
  height: 60%;
  background: radial-gradient(circle,
      rgba(59,130,246,0.35) 0%,
      transparent 70%);
  filter: blur(60px);
  z-index: -1;
  opacity: 0.6;
}

/* Subtle hover motion */
.ai-image-blend:hover .hero-image-blend {
  transform: translateY(-6px) scale(1.02);
}

@keyframes pulseGlow {
  0% { transform: scale(0.95); opacity: 0.7; }
  50% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.7; }
}

/* Subtle light reflection */
.ai-image-wrapper::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 50%;
  height: 100%;
  background: linear-gradient(
      120deg,
      rgba(255,255,255,0.1),
      rgba(255,255,255,0.05),
      transparent
  );
  transform: skewX(-20deg);
  transition: 0.7s ease;
  z-index: 3;
}

.ai-image-wrapper:hover::after {
  left: 130%;
}
.hero-title {
    font-family: 'Poppins', sans-serif;
    font-size: 3.5rem;
    font-weight: 700;
    color: #e6f0ff;
    line-height: 1.2;
}

.hero-subtitle {
    font-size: 1.1rem;
    color: #a8c7ff;
    max-width: 500px;
}

.btn-primary-exec {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    border: none;
    padding: 12px 26px;
    border-radius: 8px;
    color: white;
    font-weight: 500;
    transition: 0.3s ease;
}

.btn-primary-exec:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
}

.btn-outline-exec {
    border: 1px solid rgba(255,255,255,0.3);
    color: #cbd5e1;
    padding: 12px 26px;
    border-radius: 8px;
    transition: 0.3s ease;
}

.btn-outline-exec:hover {
    background: rgba(37, 99, 235, 0.15);
    color: white;
}

.hero-img-premium {
    width: 75%;
    max-width: 420px;
    border-radius: 20px;
    filter: drop-shadow(0 0 25px rgba(37, 99, 235, 0.35));
    opacity: 0.95;
}

.image-wrapper {
    position: relative;
}

.image-wrapper::after {
    content: "";
    position: absolute;
    top: 20%;
    left: 25%;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(37,99,235,0.4), transparent 70%);
    filter: blur(60px);
    z-index: -1;
}
/* ===== HERO IMAGE PREMIUM EFFECT ===== */

.hero-image-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.hero-image {
    width: 420px;              /* Bigger */
    border-radius: 24px;
    position: relative;
    z-index: 2;
    transition: all 0.5s ease;
    filter: brightness(1.1) contrast(1.1) saturate(1.15);
}

/* Soft Blue Executive Glow */
.hero-image-wrapper::before {
    content: "";
    position: absolute;
    width: 480px;
    height: 480px;
    background: radial-gradient(circle, 
                rgba(0,140,255,0.35) 0%, 
                rgba(0,80,200,0.2) 40%, 
                transparent 70%);
    border-radius: 50%;
    filter: blur(60px);
    z-index: 1;
}

/* Smooth Edge Blend */
.hero-image-wrapper::after {
    content: "";
    position: absolute;
    width: 430px;
    height: 430px;
    border-radius: 28px;
    box-shadow: 0 0 80px rgba(0, 132, 255, 0.35);
    z-index: 1;
}

/* Hover Elevation */
.hero-image:hover {
    transform: scale(1.05) translateY(-8px);
    filter: brightness(1.15) contrast(1.2);
}


</style>
</head>

<body>

<nav class="navbar navbar-expand-lg py-3">
  <div class="container">
    <a class="navbar-brand" href="/">WEB_SHEILD AI</a>
    <div>
      <a href="/login" class="btn btn-outline-exec me-2">Employee Access</a>
      <a href="/admin/login" class="btn btn-primary-exec">Admin Panel</a>
    </div>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

<footer class="text-center">
  AI Research-Based Organizational Threat Intelligence System
</footer>

</body>
</html>
