{% extends "base.html" %}
{% block content %}

<!-- Top Header with Back Button -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="cyber-glow">Welcome, {{ username }}</h2>

    <a href="{{ url_for('index') }}" 
       class="btn btn-outline-light back-btn">
        ← Back
    </a>
</div>

<div class="row g-4">

    <div class="col-md-6">
        <div class="glass-card text-center">
            <h4>Scan Website</h4>
            <p>Analyze URL for malicious patterns using trained ML model.</p>
            <a href="/scan_url" 
               class="btn btn-primary btn-lg w-100">
               Start URL Scan
            </a>
        </div>
    </div>

    <div class="col-md-6">
        <div class="glass-card text-center">
            <h4>Scan File</h4>
            <p>Detect suspicious file extensions and unsafe downloads.</p>
            <a href="/file_scan" 
               class="btn btn-success btn-lg w-100">
               Start File Scan
            </a>
        </div>
    </div>

</div>

{% endblock %}
