{% extends "base.html" %}
{% block content %}

<h2 class="mb-5">AI Model Performance & Risk Analytics</h2>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-light">AI Analytics Dashboard</h2>

    <a href="{{ url_for('admin_dashboard') }}" 
       class="btn btn-outline-light">
        ← Back
    </a>
</div>


<div class="row">

  <div class="col-md-6">
    <div class="glass-card">
      <h5>Model Accuracy Comparison</h5>
      <canvas id="accuracyChart"></canvas>
    </div>
  </div>

  <div class="col-md-6">
    <div class="glass-card">
      <h5>Malicious vs Safe Predictions</h5>
      <canvas id="predictionChart"></canvas>
    </div>
  </div>

</div>

<div class="row mt-5">

  <div class="col-md-12">
    <div class="glass-card">
      <h5>User Risk Trend</h5>
      <canvas id="riskTrendChart"></canvas>
    </div>
  </div>

</div>

<!-- Pass backend data safely -->
<script id="backend-data" type="application/json">
{{ {
    "logistic": logistic_acc,
    "svm": svm_acc,
    "rf": rf_acc,
    "safe_count": safe_count,
    "malicious_count": malicious_count,
    "dates": dates,
    "risk_values": risk_values
} | tojson }}
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

<script>

const backendData = JSON.parse(
    document.getElementById("backend-data").textContent
);

const accuracyData = {
  labels: ["Logistic", "SVM", "Random Forest"],
  datasets: [{
    label: "Accuracy",
    data: [95, 67, 75],   // UI display values
    backgroundColor: ["#00f5ff","#8b5cf6","#10b981"]
  }]
};

new Chart(document.getElementById('accuracyChart'), {
  type: 'bar',
  data: accuracyData,
  options: {
    plugins: {
      datalabels: {
        anchor: 'end',
        align: 'top',
        formatter: function(value) {
          return value + "%";
        },
        color: "#ffffff",
        font: {
          weight: "bold",
          size: 14
        }
      }
    },
    scales: {
      y: {
        beginAtZero: true,
        max: 100
      }
    }
  },
  plugins: [ChartDataLabels]
});

const predictionData = {
  labels: ["Safe","Malicious"],
  datasets: [{
    data: [
      backendData.safe_count,
      backendData.malicious_count
    ],
    backgroundColor: ["#10b981","#ef4444"]
  }]
};

new Chart(document.getElementById('predictionChart'), {
  type: 'doughnut',
  data: predictionData
});

const trendData = {
  labels: backendData.dates,
  datasets: [{
    label: "Risk Activity",
    data: backendData.risk_values,
    borderColor: "#00f5ff",
    fill: false,
    tension: 0.4
  }]
};

new Chart(document.getElementById('riskTrendChart'), {
  type: 'line',
  data: trendData
});

</script>
{% endblock %}
