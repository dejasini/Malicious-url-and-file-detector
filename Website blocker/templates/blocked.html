{% extends "base.html" %}
{% block content %}

<div class="container mt-5 text-center">
    <div class="glass-card p-5">

        <h1 class="text-danger mb-4">⚠ Access Blocked</h1>

        <p class="lead">
            The requested resource has been identified as malicious.
        </p>

        <div class="mt-4">
            <p><strong>URL:</strong> {{ url }}</p>
            <p><strong>Reason:</strong> {{ reason }}</p>
        </div>

        <div class="mt-4">
            <a href="/employee_dashboard" class="btn btn-primary">
                Back to Dashboard
            </a>
        </div>

    </div>
</div>

{% endblock %}
